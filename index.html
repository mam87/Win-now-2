<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>طباعة Labels</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600&display=swap');

  :root {
    --bg: #0f0f13;
    --surface: #1a1a22;
    --surface2: #22222e;
    --border: #2e2e3e;
    --accent: #00d4aa;
    --accent2: #7c6af7;
    --text: #e8e8f0;
    --text-muted: #6b6b82;
    --danger: #ff4f6a;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'IBM Plex Sans Arabic', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 24px;
  }

  h1 {
    font-size: 1.5rem;
    font-weight: 600;
    color: var(--accent);
    letter-spacing: -0.5px;
    margin-bottom: 4px;
  }
  .subtitle { color: var(--text-muted); font-size: 0.85rem; margin-bottom: 28px; }

  .layout { display: grid; grid-template-columns: 340px 1fr; gap: 20px; }

  .panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 20px;
  }

  .section-title {
    font-size: 0.7rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--text-muted);
    margin-bottom: 14px;
  }

  .field { margin-bottom: 14px; }
  label { display: block; font-size: 0.8rem; color: var(--text-muted); margin-bottom: 6px; }

  input[type=text], input[type=number], textarea {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 9px 12px;
    color: var(--text);
    font-family: inherit;
    font-size: 0.85rem;
    outline: none;
    transition: border-color 0.2s;
  }
  input:focus, textarea:focus { border-color: var(--accent); }

  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

  .btn {
    width: 100%;
    padding: 11px;
    border-radius: 9px;
    border: none;
    font-family: inherit;
    font-size: 0.85rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    margin-bottom: 8px;
  }
  .btn-primary { background: var(--accent); color: #000; }
  .btn-primary:hover { background: #00ffe0; }
  .btn-secondary { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }
  .btn-secondary:hover { border-color: var(--accent); color: var(--accent); }
  .btn-danger { background: transparent; color: var(--danger); border: 1px solid var(--danger); }
  .btn-danger:hover { background: var(--danger); color: #fff; }

  .entries-list {
    max-height: 220px;
    overflow-y: auto;
    margin-bottom: 14px;
  }
  .entry-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 10px;
    background: var(--surface2);
    border-radius: 7px;
    margin-bottom: 6px;
    font-size: 0.8rem;
  }
  .entry-item span { color: var(--text-muted); }
  .entry-item strong { color: var(--text); }
  .del-btn {
    background: none; border: none; color: var(--text-muted);
    cursor: pointer; font-size: 1rem; padding: 0 4px;
    transition: color 0.15s;
  }
  .del-btn:hover { color: var(--danger); }

  .count-badge {
    display: inline-block;
    background: var(--accent2);
    color: #fff;
    border-radius: 20px;
    padding: 2px 10px;
    font-size: 0.75rem;
    margin-bottom: 12px;
  }

  /* Preview */
  .preview-wrap {
    background: #fff;
    border-radius: 10px;
    padding: 0;
    overflow: hidden;
    min-height: 400px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  #preview-page {
    background: white;
    position: relative;
    transform-origin: top center;
  }

  .label-cell {
    position: absolute;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 2px 3px;
    border: 0.5px solid #bbb;
    box-sizing: border-box;
    overflow: hidden;
  }
  .label-cell .sp { font-size: 7px; color: #333; white-space: nowrap; overflow: hidden; }
  .label-cell .nm { font-size: 7px; color: #111; font-weight: bold; white-space: nowrap; overflow: hidden; }
  .label-cell.empty { border-color: #ddd; }

  .settings-saved {
    font-size: 0.75rem;
    color: var(--accent);
    text-align: center;
    height: 18px;
    margin-top: 4px;
    opacity: 0;
    transition: opacity 0.3s;
  }

  /* Bulk import */
  textarea { resize: vertical; min-height: 80px; }

  @media print {
    body { background: white; padding: 0; }
    .layout { display: block; }
    .panel { display: none; }
    .preview-wrap {
      background: white;
      border-radius: 0;
      padding: 0;
    }
    #preview-page { transform: none !important; }
    .label-cell { border-color: #999; }
  }
</style>
</head>
<body>

<h1>🏷️ طباعة Labels</h1>
<p class="subtitle">أدخل الأرقام والأسماء واطبع مباشرة على الملصقات</p>

<div class="layout">
  <!-- Left Panel -->
  <div>
    <!-- Page Settings -->
    <div class="panel" style="margin-bottom:16px">
      <div class="section-title">⚙️ إعدادات الصفحة</div>
      <div class="row2">
        <div class="field">
          <label>عرض Label (mm)</label>
          <input type="number" id="lw" value="24" min="5" max="200" onchange="saveSettings();renderPreview()">
        </div>
        <div class="field">
          <label>ارتفاع Label (mm)</label>
          <input type="number" id="lh" value="19" min="5" max="200" onchange="saveSettings();renderPreview()">
        </div>
        <div class="field">
          <label>عدد الأعمدة</label>
          <input type="number" id="cols" value="3" min="1" max="20" onchange="saveSettings();renderPreview()">
        </div>
        <div class="field">
          <label>عدد الصفوف</label>
          <input type="number" id="rows" value="8" min="1" max="30" onchange="saveSettings();renderPreview()">
        </div>
        <div class="field">
          <label>هامش أيسر (mm)</label>
          <input type="number" id="ml" value="0" min="0" max="50" onchange="saveSettings();renderPreview()">
        </div>
        <div class="field">
          <label>هامش علوي (mm)</label>
          <input type="number" id="mt" value="0" min="0" max="50" onchange="saveSettings();renderPreview()">
        </div>
      </div>
      <button class="btn btn-secondary" onclick="saveSettings()">💾 حفظ الإعدادات</button>
      <button class="btn btn-secondary" onclick="resetSettings()">↺ إعادة ضبط</button>
      <div class="settings-saved" id="saved-msg">✓ تم الحفظ</div>
    </div>

    <!-- Add Entry -->
    <div class="panel" style="margin-bottom:16px">
      <div class="section-title">➕ إضافة Label</div>
      <div class="row2">
        <div class="field">
          <label>SP No</label>
          <input type="text" id="sp-input" placeholder="مثال: 1001" onkeydown="if(event.key==='Enter')addEntry()">
        </div>
        <div class="field">
          <label>الاسم</label>
          <input type="text" id="name-input" placeholder="الاسم" onkeydown="if(event.key==='Enter')addEntry()">
        </div>
      </div>
      <button class="btn btn-primary" onclick="addEntry()">+ إضافة</button>

      <div class="section-title" style="margin-top:16px">📋 استيراد دفعة (SP,Name في كل سطر)</div>
      <textarea id="bulk-input" placeholder="1001,أحمد محمد&#10;1002,سارة علي&#10;1003,محمد خالد"></textarea>
      <button class="btn btn-secondary" onclick="bulkAdd()" style="margin-top:8px">استيراد الكل</button>
    </div>

    <!-- Entries List -->
    <div class="panel">
      <div class="section-title">📝 القائمة</div>
      <div class="count-badge" id="count-badge">0 label</div>
      <div class="entries-list" id="entries-list"></div>
      <button class="btn btn-primary" onclick="printLabels()">🖨️ طباعة</button>
      <button class="btn btn-danger" onclick="clearAll()">🗑️ مسح الكل</button>
    </div>
  </div>

  <!-- Right: Preview -->
  <div class="panel">
    <div class="section-title">👁️ معاينة</div>
    <div class="preview-wrap">
      <div id="preview-page"></div>
    </div>
  </div>
</div>

<script>
let entries = [];

// Load settings from localStorage
function loadSettings() {
  const s = localStorage.getItem('label_settings');
  if (s) {
    const d = JSON.parse(s);
    document.getElementById('lw').value = d.lw ?? 24;
    document.getElementById('lh').value = d.lh ?? 19;
    document.getElementById('cols').value = d.cols ?? 3;
    document.getElementById('rows').value = d.rows ?? 8;
    document.getElementById('ml').value = d.ml ?? 0;
    document.getElementById('mt').value = d.mt ?? 0;
  }
  const e = localStorage.getItem('label_entries');
  if (e) {
    entries = JSON.parse(e);
    renderList();
  }
}

function saveSettings() {
  const s = {
    lw: +document.getElementById('lw').value,
    lh: +document.getElementById('lh').value,
    cols: +document.getElementById('cols').value,
    rows: +document.getElementById('rows').value,
    ml: +document.getElementById('ml').value,
    mt: +document.getElementById('mt').value,
  };
  localStorage.setItem('label_settings', JSON.stringify(s));
  const msg = document.getElementById('saved-msg');
  msg.style.opacity = 1;
  setTimeout(() => msg.style.opacity = 0, 1500);
}

function resetSettings() {
  localStorage.removeItem('label_settings');
  document.getElementById('lw').value = 24;
  document.getElementById('lh').value = 19;
  document.getElementById('cols').value = 3;
  document.getElementById('rows').value = 8;
  document.getElementById('ml').value = 0;
  document.getElementById('mt').value = 0;
  renderPreview();
}

function getSettings() {
  return {
    lw: +document.getElementById('lw').value,
    lh: +document.getElementById('lh').value,
    cols: +document.getElementById('cols').value,
    rows: +document.getElementById('rows').value,
    ml: +document.getElementById('ml').value,
    mt: +document.getElementById('mt').value,
  };
}

function addEntry() {
  const sp = document.getElementById('sp-input').value.trim();
  const name = document.getElementById('name-input').value.trim();
  if (!sp && !name) return;
  entries.push({ sp, name });
  document.getElementById('sp-input').value = '';
  document.getElementById('name-input').value = '';
  document.getElementById('sp-input').focus();
  saveEntries();
  renderList();
  renderPreview();
}

function bulkAdd() {
  const raw = document.getElementById('bulk-input').value.trim();
  if (!raw) return;
  const lines = raw.split('\n');
  lines.forEach(line => {
    const parts = line.split(',');
    const sp = (parts[0] || '').trim();
    const name = (parts[1] || '').trim();
    if (sp || name) entries.push({ sp, name });
  });
  document.getElementById('bulk-input').value = '';
  saveEntries();
  renderList();
  renderPreview();
}

function deleteEntry(i) {
  entries.splice(i, 1);
  saveEntries();
  renderList();
  renderPreview();
}

function clearAll() {
  if (!confirm('مسح جميع الـ labels؟')) return;
  entries = [];
  saveEntries();
  renderList();
  renderPreview();
}

function saveEntries() {
  localStorage.setItem('label_entries', JSON.stringify(entries));
}

function renderList() {
  const list = document.getElementById('entries-list');
  const badge = document.getElementById('count-badge');
  badge.textContent = entries.length + ' label';
  if (entries.length === 0) {
    list.innerHTML = '<div style="color:var(--text-muted);font-size:0.8rem;text-align:center;padding:16px">لا يوجد labels بعد</div>';
    return;
  }
  list.innerHTML = entries.map((e, i) => `
    <div class="entry-item">
      <div>
        <span>SP: </span><strong>${e.sp || '—'}</strong>
        &nbsp;|&nbsp;
        <span>الاسم: </span><strong>${e.name || '—'}</strong>
      </div>
      <button class="del-btn" onclick="deleteEntry(${i})">✕</button>
    </div>
  `).join('');
}

function renderPreview() {
  const { lw, lh, cols, rows, ml, mt } = getSettings();
  const PX_PER_MM = 3.78; // 96dpi / 25.4

  const pageW = 210 * PX_PER_MM;
  const pageH = 297 * PX_PER_MM;
  const labelW = lw * PX_PER_MM;
  const labelH = lh * PX_PER_MM;
  const marginL = ml * PX_PER_MM;
  const marginT = mt * PX_PER_MM;

  const page = document.getElementById('preview-page');
  page.style.width = pageW + 'px';
  page.style.height = pageH + 'px';

  // Scale to fit preview area
  const wrap = page.parentElement;
  const availW = wrap.clientWidth - 20;
  const availH = window.innerHeight * 0.75;
  const scale = Math.min(availW / pageW, availH / pageH, 1);
  page.style.transform = `scale(${scale})`;
  page.style.marginTop = `-${pageH * (1 - scale) / 2}px`;
  wrap.style.height = (pageH * scale + 20) + 'px';

  let html = '';
  let idx = 0;
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      const x = marginL + c * labelW;
      const y = marginT + r * labelH;
      const entry = entries[idx] || null;
      html += `<div class="label-cell ${entry ? '' : 'empty'}" style="left:${x}px;top:${y}px;width:${labelW}px;height:${labelH}px">
        <div class="sp">SP: ${entry ? entry.sp : ''}</div>
        <div class="nm">${entry ? entry.name : ''}</div>
      </div>`;
      idx++;
    }
  }
  page.innerHTML = html;
}

function printLabels() {
  if (entries.length === 0) { alert('أضف labels أولاً'); return; }
  const { lw, lh, cols, rows, ml, mt } = getSettings();

  // Build print-ready HTML
  const labelsPerPage = cols * rows;
  const totalPages = Math.ceil(entries.length / labelsPerPage);

  let pagesHTML = '';
  for (let p = 0; p < totalPages; p++) {
    let labelsHTML = '';
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        const idx = p * labelsPerPage + r * cols + c;
        const entry = entries[idx] || { sp: '', name: '' };
        const x = ml + c * lw;
        const y = mt + r * lh;
        labelsHTML += `<div style="position:absolute;left:${x}mm;top:${y}mm;width:${lw}mm;height:${lh}mm;box-sizing:border-box;border:0.3px solid #aaa;padding:1mm 1.5mm;overflow:hidden;display:flex;flex-direction:column;justify-content:center;">
          <div style="font-size:6pt;color:#333;white-space:nowrap">SP No: ${entry.sp}</div>
          <div style="font-size:6pt;font-weight:bold;color:#111;white-space:nowrap">Name: ${entry.name}</div>
        </div>`;
      }
    }
    pagesHTML += `<div style="position:relative;width:210mm;height:297mm;background:white;page-break-after:always;">${labelsHTML}</div>`;
  }

  const win = window.open('', '_blank');
  win.document.write(`<!DOCTYPE html><html><head><meta charset="UTF-8">
    <style>
      body { margin:0; padding:0; }
      @page { size: A4; margin: 0; }
      @media print { body { margin:0; } }
    </style>
  </head><body>${pagesHTML}<script>window.onload=()=>{window.print();window.close();}<\/script></body></html>`);
  win.document.close();
}

// Init
loadSettings();
renderPreview();
window.addEventListener('resize', renderPreview);
</script>
</body>
</html>
