<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>طباعة Labels</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600&display=swap');

  :root {
    --bg: #0f0f13;
    --surface: #1a1a22;
    --surface2: #22222e;
    --border: #2e2e3e;
    --accent: #00d4aa;
    --accent2: #7c6af7;
    --text: #e8e8f0;
    --text-muted: #6b6b82;
    --danger: #ff4f6a;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'IBM Plex Sans Arabic', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 16px;
  }

  h1 { font-size: 1.3rem; font-weight: 600; color: var(--accent); margin-bottom: 2px; }
  .subtitle { color: var(--text-muted); font-size: 0.8rem; margin-bottom: 20px; }

  .panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px;
    margin-bottom: 14px;
  }

  .section-title {
    font-size: 0.68rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--text-muted);
    margin-bottom: 12px;
  }

  .field { margin-bottom: 12px; }
  label { display: block; font-size: 0.78rem; color: var(--text-muted); margin-bottom: 5px; }

  input[type=text], input[type=number], textarea {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 9px 12px;
    color: var(--text);
    font-family: inherit;
    font-size: 0.85rem;
    outline: none;
    transition: border-color 0.2s;
  }
  input:focus, textarea:focus { border-color: var(--accent); }

  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

  .btn {
    width: 100%;
    padding: 12px;
    border-radius: 9px;
    border: none;
    font-family: inherit;
    font-size: 0.88rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    margin-bottom: 8px;
  }
  .btn-primary { background: var(--accent); color: #000; }
  .btn-primary:hover, .btn-primary:active { background: #00ffe0; }
  .btn-secondary { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }
  .btn-secondary:hover { border-color: var(--accent); color: var(--accent); }
  .btn-danger { background: transparent; color: var(--danger); border: 1px solid var(--danger); }
  .btn-danger:active { background: var(--danger); color: #fff; }

  .entries-list { max-height: 200px; overflow-y: auto; margin-bottom: 12px; }
  .entry-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 10px;
    background: var(--surface2);
    border-radius: 7px;
    margin-bottom: 6px;
    font-size: 0.78rem;
  }
  .entry-item span { color: var(--text-muted); }
  .entry-item strong { color: var(--text); }
  .del-btn { background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 1rem; padding: 0 4px; }
  .del-btn:active { color: var(--danger); }

  .count-badge {
    display: inline-block;
    background: var(--accent2);
    color: #fff;
    border-radius: 20px;
    padding: 2px 10px;
    font-size: 0.75rem;
    margin-bottom: 10px;
  }

  .settings-saved {
    font-size: 0.75rem; color: var(--accent);
    text-align: center; height: 18px; margin-top: 4px;
    opacity: 0; transition: opacity 0.3s;
  }

  textarea { resize: vertical; min-height: 70px; }

  .info-box {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 0.78rem;
    color: var(--text-muted);
    margin-bottom: 10px;
    line-height: 1.6;
  }
  .info-box strong { color: var(--accent); }
</style>
</head>
<body>

<h1>🏷️ طباعة Labels</h1>
<p class="subtitle">أدخل الأرقام والأسماء واحفظ PDF مباشرة</p>

<!-- Page Settings -->
<div class="panel">
  <div class="section-title">⚙️ إعدادات الصفحة</div>
  <div class="row2">
    <div class="field">
      <label>عرض Label (mm)</label>
      <input type="number" id="lw" value="24" min="5" max="200" onchange="saveSettings()">
    </div>
    <div class="field">
      <label>ارتفاع Label (mm)</label>
      <input type="number" id="lh" value="19" min="5" max="200" onchange="saveSettings()">
    </div>
    <div class="field">
      <label>عدد الأعمدة</label>
      <input type="number" id="cols" value="3" min="1" max="20" onchange="saveSettings()">
    </div>
    <div class="field">
      <label>عدد الصفوف</label>
      <input type="number" id="rows" value="8" min="1" max="30" onchange="saveSettings()">
    </div>
    <div class="field">
      <label>هامش أيسر (mm)</label>
      <input type="number" id="ml" value="0" min="0" max="50" onchange="saveSettings()">
    </div>
    <div class="field">
      <label>هامش علوي (mm)</label>
      <input type="number" id="mt" value="0" min="0" max="50" onchange="saveSettings()">
    </div>
  </div>
  <button class="btn btn-secondary" onclick="saveSettings()">💾 حفظ الإعدادات</button>
  <button class="btn btn-secondary" onclick="resetSettings()">↺ إعادة ضبط</button>
  <div class="settings-saved" id="saved-msg">✓ تم الحفظ</div>
</div>

<!-- Add Entry -->
<div class="panel">
  <div class="section-title">➕ إضافة Label</div>
  <div class="row2">
    <div class="field">
      <label>SP No</label>
      <input type="text" id="sp-input" placeholder="مثال: 1001">
    </div>
    <div class="field">
      <label>الاسم</label>
      <input type="text" id="name-input" placeholder="الاسم">
    </div>
  </div>
  <button class="btn btn-primary" onclick="addEntry()">+ إضافة</button>

  <div class="section-title" style="margin-top:14px">📋 استيراد دفعة</div>
  <div class="info-box">كل سطر: <strong>SP,الاسم</strong><br>مثال: 1001,أحمد محمد</div>
  <textarea id="bulk-input" placeholder="1001,أحمد محمد&#10;1002,سارة علي&#10;1003,محمد خالد"></textarea>
  <button class="btn btn-secondary" onclick="bulkAdd()" style="margin-top:8px">📥 استيراد الكل</button>
</div>

<!-- List -->
<div class="panel">
  <div class="section-title">📝 القائمة</div>
  <div class="count-badge" id="count-badge">0 label</div>
  <div class="entries-list" id="entries-list"></div>
  <button class="btn btn-primary" onclick="generatePDF()">📄 توليد PDF وتحميله</button>
  <button class="btn btn-danger" onclick="clearAll()">🗑️ مسح الكل</button>
</div>

<script>
const { jsPDF } = window.jspdf;
let entries = [];

function loadSettings() {
  const s = localStorage.getItem('label_settings');
  if (s) {
    const d = JSON.parse(s);
    document.getElementById('lw').value = d.lw ?? 24;
    document.getElementById('lh').value = d.lh ?? 19;
    document.getElementById('cols').value = d.cols ?? 3;
    document.getElementById('rows').value = d.rows ?? 8;
    document.getElementById('ml').value = d.ml ?? 0;
    document.getElementById('mt').value = d.mt ?? 0;
  }
  const e = localStorage.getItem('label_entries');
  if (e) { entries = JSON.parse(e); renderList(); }
}

function saveSettings() {
  const s = {
    lw: +document.getElementById('lw').value,
    lh: +document.getElementById('lh').value,
    cols: +document.getElementById('cols').value,
    rows: +document.getElementById('rows').value,
    ml: +document.getElementById('ml').value,
    mt: +document.getElementById('mt').value,
  };
  localStorage.setItem('label_settings', JSON.stringify(s));
  const msg = document.getElementById('saved-msg');
  msg.style.opacity = 1;
  setTimeout(() => msg.style.opacity = 0, 1500);
}

function resetSettings() {
  localStorage.removeItem('label_settings');
  ['lw','lh','cols','rows','ml','mt'].forEach((id,i) => {
    document.getElementById(id).value = [24,19,3,8,0,0][i];
  });
}

function getSettings() {
  return {
    lw: +document.getElementById('lw').value,
    lh: +document.getElementById('lh').value,
    cols: +document.getElementById('cols').value,
    rows: +document.getElementById('rows').value,
    ml: +document.getElementById('ml').value,
    mt: +document.getElementById('mt').value,
  };
}

function addEntry() {
  const sp = document.getElementById('sp-input').value.trim();
  const name = document.getElementById('name-input').value.trim();
  if (!sp && !name) return;
  entries.push({ sp, name });
  document.getElementById('sp-input').value = '';
  document.getElementById('name-input').value = '';
  document.getElementById('sp-input').focus();
  saveEntries(); renderList();
}

function bulkAdd() {
  const raw = document.getElementById('bulk-input').value.trim();
  if (!raw) return;
  raw.split('\n').forEach(line => {
    const parts = line.split(',');
    const sp = (parts[0] || '').trim();
    const name = (parts[1] || '').trim();
    if (sp || name) entries.push({ sp, name });
  });
  document.getElementById('bulk-input').value = '';
  saveEntries(); renderList();
}

function deleteEntry(i) {
  entries.splice(i, 1);
  saveEntries(); renderList();
}

function clearAll() {
  if (!confirm('مسح جميع الـ labels؟')) return;
  entries = []; saveEntries(); renderList();
}

function saveEntries() {
  localStorage.setItem('label_entries', JSON.stringify(entries));
}

function renderList() {
  const list = document.getElementById('entries-list');
  const badge = document.getElementById('count-badge');
  badge.textContent = entries.length + ' label';
  if (entries.length === 0) {
    list.innerHTML = '<div style="color:var(--text-muted);font-size:0.8rem;text-align:center;padding:16px">لا يوجد labels بعد</div>';
    return;
  }
  list.innerHTML = entries.map((e, i) => `
    <div class="entry-item">
      <div>
        <span>SP: </span><strong>${e.sp || '—'}</strong>
        &nbsp;|&nbsp;
        <span>الاسم: </span><strong>${e.name || '—'}</strong>
      </div>
      <button class="del-btn" onclick="deleteEntry(${i})">✕</button>
    </div>
  `).join('');
}

function generatePDF() {
  if (entries.length === 0) { alert('أضف labels أولاً'); return; }

  const { lw, lh, cols, rows, ml, mt } = getSettings();
  const labelsPerPage = cols * rows;
  const totalPages = Math.ceil(entries.length / labelsPerPage);

  const doc = new jsPDF({ unit: 'mm', format: 'a4', orientation: 'portrait' });

  for (let p = 0; p < totalPages; p++) {
    if (p > 0) doc.addPage();

    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        const idx = p * labelsPerPage + r * cols + c;
        if (idx >= entries.length) continue;

        const entry = entries[idx];
        const x = ml + c * lw;
        const y = mt + r * lh;

        // Border
        doc.setDrawColor(170);
        doc.setLineWidth(0.2);
        doc.rect(x, y, lw, lh);

        // SP No
        doc.setFontSize(6);
        doc.setTextColor(80);
        doc.text('SP No: ' + entry.sp, x + 1.5, y + 6);

        // Name
        doc.setFontSize(6.5);
        doc.setTextColor(20);
        doc.setFont(undefined, 'bold');
        doc.text('Name: ' + entry.name, x + 1.5, y + 13);
        doc.setFont(undefined, 'normal');
      }
    }
  }

  doc.save('labels.pdf');
}

loadSettings();
</script>
</body>
</html>
